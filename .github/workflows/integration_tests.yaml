
name: Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      DATABASE_URI: ${{ secrets.TEST_DB_URI }}
      MIN_POOL_SIZE: ${{ secrets.MIN_POOL_SIZE }}
      MAX_POOL_SIZE: ${{ secrets.MAX_POOL_SIZE }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      AUTO_INGESTION: ${{ secrets.AUTO_INGESTION }}
      INGESTION_INTERVAL: ${{ secrets.INGESTION_INTERVAL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.12"

      - name: Install Python
        run: uv python install 3.13.13

      - name: Set up dependencies
        run: uv sync --locked

      c

      - name: Wait for SQL Server
        env:
          TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: |
          for i in $(seq 1 60); do
            if /opt/mssql-tools18/bin/sqlcmd \
              -S localhost,1433 \
              -U sa \
              -P "$TEST_DB_PASSWORD" \
              -C -b -Q "SELECT 1"; then
              echo "SQL Server is ready"
              exit 0
            fi
            sleep 2
          done

          echo "SQL Server did not become ready"
          exit 1

      - name: Create test database
        env:
          TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "$TEST_DB_PASSWORD" \
            -C -b -d master \
            -Q "IF DB_ID(N'friskit_test') IS NULL
                CREATE DATABASE friskit_test;"

      - name: Run DDL scripts
        env:
          TEST_DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S localhost,1433 \
            -U sa \
            -P "$TEST_DB_PASSWORD" \
            -C -b \
            -d friskit_test \
            -i sql/scripts.sql

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        if: ${{ always() }}
        run: uv run ruff format --check .

      - name: Type check
        if: ${{ always() }}
        run: uv run mypy src

      - name: Run tests
        if: ${{ always() }}
        run: uv run pytest

      - name: Set up Node.js
        if: ${{ always() }}
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Newman
        if: ${{ always() }}
        run: npm install -g newman

      - name: Start server
        if: ${{ always() }}
        run: |
          uv run uvicorn app:app \
            --host 0.0.0.0 \
            --port 8000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for API
        if: ${{ always() }}
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:8000/openapi.json \
              -o /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done

          cat server.log
          echo "API failed to start"
          exit 1

      - name: Run Postman collection with Newman
        if: ${{ always() }}
        env:
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: |
          newman run \
            postman-collections/Ingestion-Engine.postman_collection.json \
            --env-var "BASE_URL=http://127.0.0.1:8000" \
            --env-var "password=$TEST_ADMIN_PASSWORD" \
            --env-var "Username=Admin" \
            --env-var "AccountCode=" \
            --env-var "user_id="

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-server-logs
          path: server.log
          if-no-files-found: ignore
