name: Test CI

on:
    push:
        branches: [main,master]
    pull_request:
        branches: [main,master]
permissions:
    contents: read
jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
              with:
                version: "0.12.12"

            - name: Install Python
              run: uv python install 3.13.13

            - name: Install Dependencies
              run: uv sync --locked

            - name: Run Tests
              run: uv run pytest