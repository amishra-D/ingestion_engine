name: Test CI

on:
    push:
        branches: [main,master]
    pull_request:
        branches: [main,master]
permissions:
    contents: read
jobs:
    tests:
        runs-on: ubuntu-latest
        env:
            DATABASE_URI: ${{secrets.DATABASE_URI}}
            MIN_POOL_SIZE: ${{secrets.MIN_POOL_SIZE}}
            MAX_POOL_SIZE: ${{secrets.MAX_POOL_SIZE}}
            ALGORITHM: ${{secrets.ALGORITHM}}
            SECRET_KEY: ${{secrets.SECRET_KEY}}
            AUTO_INGESTION: ${{secrets.AUTO_INGESTION}}
            INGESTION_INTERVAL: ${{secrets.INGESTION_INTERVAL}}
        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: Install uv
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
              with:
                version: "0.12.12"

            - name: Install Python
              run: uv python install 3.13.13

            - name: Install Dependencies
              run: uv sync --locked

            - name: Run Tests
              run: uv run pytest