[project]
name = "ingestion-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amishra-D", email = "anshumishraocog@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aioodbc>=0.5.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyodbc>=5.3.0",
    "ruff>=0.16.10",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
ingestion-engine = "ingestion_engine:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
ignore = ["B008", "RUF012"]
